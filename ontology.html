 pal:{h:'팔란티어 방식 — 자세히',b:[

  '<tr><td>② 같은 것 묶기</td><td>이름이 달라도 같은 대상이면 하나로 묶는다 — 가장 어렵고 가장 값진 일</td><td>T-GIS 521 · 신호 4039 · 사고 자료 「서초역 사거리」 = 서초역사거리 하나</td></tr>'+
  '<tr><td>③ 관계 긋기</td><td>대상끼리 무슨 사이인지 선을 긋는다</td><td>이 부품이 늦으면 → 이 공정이 막힘 / 이 신호가 길면 → 상류가 막힘</td></tr>'+

  '<p><b>왜 이렇게 하나요?</b> 자료가 엑셀 수백 개로 흩어져 있으면 질문 하나에 사람이 며칠씩 파일을 뒤져 손으로 잇습니다. 그 사람이 떠나면 연결도 사라집니다. 대상과 관계로 묶어 두면 질문 하나로 근거까지 바로 나오고, 담당자가 바뀌어도 「왜」가 남습니다.</p>'+

 win:{h:'성공 사례 — 무엇을 묶어 무엇이 달라졌나',b:[
  '<p class="small">회사·기관이 발표했거나 언론이 보도한 내용입니다. 독립 평가가 없는 수치는 그렇다고 적었습니다.</p>'+
  '<p><b>1. 우크라이나 — 전쟁범죄 증거 정리 (2023.4 · 검찰총장실)</b></p>'+
  '<ul><li><b>문제</b>: 신고된 전쟁범죄가 7만 8천 건이 넘었습니다(살해·고문·성범죄·파괴). 진술·사진·영상·위성사진이 따로 쌓여 사람 손으로는 사건끼리 잇는 것이 사실상 불가능했습니다.</li>'+
  '<li><b>묶은 것</b>: 장소와 시각을 기준으로 공개 정보(OSINT)와 위성사진을 겹쳐 「어디서 · 언제 · 무엇이」를 지도로 만들었습니다.</li>'+
  '<li><b>효과</b>: 흩어진 증거가 사건 단위로 모여 수사가 가능한 형태가 됐습니다. 당시 검찰총장은 이 양을 현대 IT 없이 분석하는 것은 사실상 불가능하다고 말했습니다. 회사는 이 일에 돈을 받지 않았다고 보도됐습니다.</li></ul>'+
  '<p><b>2. 우크라이나 — 지뢰 제거 우선순위 (2024.3 · 경제부)</b></p>'+
  '<ul><li><b>문제</b>: 지뢰 오염 의심 땅이 약 15만 6천㎢. 정부기관과 민간 제거 단체가 조사 자료를 각자 갖고 있었습니다.</li>'+
  '<li><b>묶은 것</b>: 조사 결과를 땅(구역) 기준으로 한 판에 모으고, 농사·복구에 얼마나 급한지를 같이 놓았습니다.</li>'+
  '<li><b>효과</b>: 「어디를 먼저 치워야 사람이 빨리 돌아오나」를 판단하는 근거가 생겼습니다. 새 자료를 만든 것이 아니라 이미 있는 자료를 같은 땅으로 묶은 것입니다.</li></ul>'+
  '<p><b>3. 우크라이나 · NATO — 전장 상황판</b></p>'+
  '<ul><li><b>묶은 것</b>: 상업 위성사진 · 드론 영상 · 공개 정보 · 현장 보고를 한 지도 위 「같은 그림」으로 겹쳤습니다.</li>'+
  '<li><b>효과</b>: 보도에 따르면 큰 부대가 하던 전장 자료 분석을 20~50명이 하게 됐고, NATO도 같은 계열 체계(Maven)를 들였습니다. 표적 판단의 마지막 승인은 사람이 한다고 보도됐습니다.</li>'+
  '<li><b>주의</b>: 민간인 피해와 연결됐다는 주장이 있으나 확인된 사건으로 분류되지는 않았습니다(아래 실패 사례 5).</li></ul>'+
  '<p><b>4. 미 해군 — 잠수함·함정 건조 「ShipOS」 (2025.12~)</b></p>'+
  '<ul><li><b>문제</b>: 핵잠수함 건조가 계속 늦었습니다. 까닭은 손이 아니라 「어느 부품이 어디서 얼마나 늦고, 그게 어느 공정을 막는지」를 아무도 한눈에 못 보는 것이었습니다. 조선소 일정표 · 자재 현황 · 납품업체 납기가 서로 다른 체계에 있었습니다.</li>'+
  '<li><b>묶은 것</b>: 배 · 공정 · 부품 · 공급업체 · 검사를 대상으로, 「이 부품이 늦으면 → 이 공정이 막히고 → 진수가 며칠 밀린다」를 관계로 이었습니다. 해군 공공 조선소 4곳 · 민간 2곳 · 핵심 공급업체 · 2년 최대 4억 4,800만 달러.</li>'+
  '<li><b>효과(시범 · 해군·회사 발표)</b>: 일렉트릭 보트 조선소 일정 계획 <b>사람 손 160시간 → 10분 미만</b> · 포츠머스 해군 조선소 자재 검토 <b>몇 주 → 1시간 미만</b>. 해군은 「측정 가능한 절감과 일정 단축」을 성공 기준으로 걸었고 회사도 「가치를 증명해야 한다」고 했습니다 — 지금은 시범이 좋아 크게 시험하는 단계입니다.</li></ul>'+
  '<p><b>5. 에어버스 — 「Skywise」 (항공기 정비·생산)</b></p>'+
  '<ul><li><b>묶은 것</b>: 항공사 · 정비업체 · 당국 · 에어버스가 각자 가진 항공기 자료를 항공기·부품 기준으로 이었습니다(회사 공시 기준 1만 대 이상).</li>'+
  '<li><b>효과</b>: 생산계획 · 품질 · 공급망 앱 600여 개가 매일 이 위에서 돌고 사용자가 5만 명이 넘는다고 보도됐습니다. 고장 나기 전에 정비할 부품을 고르는 데 씁니다.</li>'+
  '<li><b>논란</b>: 자료가 미국 법의 손에 닿을 수 있느냐(자료 주권)를 두고 스위스 군 보고서가 의문을 냈다고 보도됐습니다.</li></ul>'+
  '<p><b>6. 독일 헤센주 경찰 — 아동 성착취 사건 (2019)</b></p>'+
  '<ul><li><b>효과</b>: 베르기슈 글라트바흐 사건에서 흩어진 수사 자료를 엮어 여러 용의자의 신원을 밝히는 데 썼다고 보도됐습니다.</li>'+
  '<li><b>그러나</b>: 같은 체계가 뒤에 헌법재판소 판단을 받았습니다(아래 실패 사례 4) — 효과가 있어도 법의 테두리가 먼저라는 예입니다.</li></ul>'+
  '<p><b>공통점</b>: ① 새 자료를 만든 곳은 없다 — 이미 있는 자료를 같은 대상으로 묶었다 ② 묶는 기준이 <b>장소 · 사건 · 물건</b>이었다 ③ 결과를 숫자로 재거나 근거를 보였다 ④ 마지막 판단은 사람이 했다.</p>',
  '<p class="small">출처: <a href="https://fedscoop.com/palantir-to-help-ukraine-process-data-in-war-crimes-investigations/" target="_blank" rel="noopener">FedScoop — 전쟁범죄</a> · <a href="https://www.businesswire.com/news/home/20240304069003/en/Palantir-and-Ministry-of-Economy-of-Ukraine-Sign-Demining-Partnership" target="_blank" rel="noopener">Business Wire — 지뢰 제거</a> · <a href="https://en.ain.ua/2025/04/15/nato-acquires-palantir-military-ai-system" target="_blank" rel="noopener">AIN — NATO Maven</a> · <a href="https://breakingdefense.com/2025/12/navy-palantir-unveil-shipos-in-a-bid-to-boost-nuclear-sub-production/" target="_blank" rel="noopener">Breaking Defense — ShipOS</a> · <a href="https://www.theregister.com/2025/12/10/palantir_navy_448_million_contract/" target="_blank" rel="noopener">The Register — ShipOS 시범 수치</a> · <a href="https://www.sec.gov/Archives/edgar/data/1321655/000132165523000011/pltr-20221231.htm" target="_blank" rel="noopener">Palantir 10-K — Skywise</a> · <a href="https://lessentieldeleco.fr/5953-palantir-ce-rapport-suisse-quairbus-a-choisi-dignorer/" target="_blank" rel="noopener">L’Essentiel de l’Éco — 에어버스·헤센</a></p>']},
 fail:{h:'실패 사례 — 왜 그렇게 됐나',b:[
  '<p class="small">각 사례마다 ① 무엇을 했나 ② 효과는 있었나 ③ 왜 반발이 일었나 ④ 우리에게 주는 교훈. 보도마다 설명이 다른 대목은 그렇다고 적었습니다.</p>'+
  '<p><b>1. 미국 뉴올리언스 경찰 — 6년 만에 종료 (2012~2018)</b></p>'+
  '<ul><li><b>무엇을</b>: 사람·사건 자료를 엮어 범죄에 휘말릴 사람과 조직을 찾는 데 썼습니다. 시의 정식 계약이 아니라 회사의 기부 형식(무상)이었고 세 번 연장됐습니다.</li>'+
  '<li><b>효과</b>: 조직폭력 사건 수사에 쓰였다고 보도됐습니다.</li>'+
  '<li><b>왜 반발했나</b>: 2018년 언론 보도로 드러나기 전까지 <b>시민도, 시의원 상당수도 그런 체계가 있는 줄 몰랐습니다</b>. 기부 형식이라 예산 심의를 거치지 않았기 때문입니다. 보도 며칠 뒤 시장실이 연장하지 않겠다고 했습니다.</li>'+
  '<li><b>교훈</b>: 결과가 좋아도 <b>몰래 하면 신뢰를 잃고 끝난다</b>. 무엇을 쓰는지 공개하고 근거를 보여야 오래 간다.</li></ul>'+
  '<p><b>2. 미국 LA 경찰 「LASER」 — 중단 (2011~2019 무렵)</b></p>'+
  '<ul><li><b>무엇을</b>: 범죄가 잦은 장소와 「상습 위험 인물」을 골라 점수를 매기고, 그 목록으로 순찰을 보냈습니다.</li>'+
  '<li><b>효과</b>: 장소 중심 순찰은 효과를 주장했으나, 인물 점수의 기준이 들쭉날쭉하다는 감찰 결과가 나왔습니다.</li>'+
  '<li><b>왜 반발했나</b>: 넣은 자료가 이미 특정 동네를 더 많이 단속한 기록이라, <b>체계가 그 동네를 다시 더 단속하게 만드는 되먹임</b>이 생긴다는 비판을 받았습니다. 사람에게 점수를 매긴다는 것 자체가 반발을 샀습니다. 종료 까닭(여론·감찰·예산)은 보도마다 조금씩 다르고, 이름을 바꿔 이어졌다는 주장도 있습니다.</li>'+
  '<li><b>교훈</b>: <b>나쁜 자료를 넣으면 나쁜 판단이 그럴듯하게 나온다</b>. 사람에게 점수를 매기지 말고 장소·시각·사건을 묶어라.</li></ul>'+
  '<p><b>3. 영국 NHS(국민보건서비스) 연합 데이터 플랫폼 — 진행 중 논란 (2023~)</b></p>'+
  '<ul><li><b>무엇을</b>: 병원마다 따로 있는 대기 명단 · 수술 일정 · 병상 자료를 이어 대기 시간을 줄이려 했습니다. 3억 3천만 파운드 계약.</li>'+
  '<li><b>효과</b>: 쓰는 병원에서는 수술 일정 효과를 주장합니다. 그러나 2024년 말까지 병원 트러스트 215곳 가운데 <b>4분의 1도 안 되는 곳만 실제로 썼습니다</b>. 보도에 따르면 감독 기관이 전체 비용을 11억 파운드로 올려 잡은 반면 예상 효과는 8억 800만 파운드로 내려갔습니다.</li>'+
  '<li><b>왜 반발했나</b>: ① 의료기록은 가장 민감한 개인정보인데 회사가 미국 정보기관·이민단속과 일한다는 점에 대한 불신 ② <b>4만 4천 명 넘게</b> 자기 기록 처리에 법적 이의를 냄 ③ 현장 직원 일부가 쓰기 불편하다고 함 ④ 소프트웨어를 사는 게 아니라 구독이라 빠져나오기 어렵다(묶임)는 비판. 정부가 계약 해지 조항을 검토한다는 보도도 있습니다.</li>'+
  '<li><b>교훈</b>: <b>위에서 사도 현장이 안 쓰면 실패</b>다. 개인정보를 다루면 기술보다 신뢰가 먼저다.</li></ul>'+
  '<p><b>4. 독일 헤센·함부르크 경찰 — 헌법재판소 판단 (2023.2)</b></p>'+
  '<ul><li><b>무엇을</b>: 경찰이 가진 여러 자료를 자동으로 엮어 분석했습니다(헤센은 위 성공 사례 6의 그 체계).</li>'+
  '<li><b>효과</b>: 아동 성착취 사건 등에서 효과가 있었다고 보도됐습니다.</li>'+
  '<li><b>왜 문제가 됐나</b>: 연방헌법재판소가 자동 자료 분석을 허용한 주 법 조항이 <b>언제·무엇을·얼마나 엮을 수 있는지 요건이 너무 넓어</b> 기본권을 침해한다고 판단했습니다(일부 위헌 · 법을 고칠 때까지 좁은 조건에서만).</li>'+
  '<li><b>교훈</b>: 효과가 있어도 <b>법적 근거와 범위 제한</b>이 없으면 멈춘다. 경찰은 연결 권한이 먼저다 — 그래서 T-Book·데이터 압축지도는 개인을 식별하지 않는 공공데이터만 묶는다.</li></ul>'+
  '<p><b>5. 전장 표적 AI — 책임 논란 (진행 중)</b></p>'+
  '<ul><li><b>무엇을</b>: 우크라이나·미군에서 표적 정보를 묶어 판단을 빠르게 하는 데 쓰였다고 보도됐습니다.</li>'+
  '<li><b>효과</b>: 판단 속도와 인력 절감(성공 사례 3).</li>'+
  '<li><b>왜 논란인가</b>: 민간인 피해와 연결됐다는 주장이 나왔습니다(국제기구 기록에서는 확인된 사건이 아니라 참고 정보로 분류). 체계가 표적을 「골라 주면」 사람의 승인이 형식이 되지 않느냐, 틀리면 누가 책임지느냐가 쟁점입니다.</li>'+
  '<li><b>교훈</b>: 빠를수록 <b>마지막 판단과 책임은 사람</b>에게 남겨야 한다. 지도는 근거를 보이고, 결정은 사람이 한다.</li></ul>'+
  '<p><b>성공과 실패를 가른 것</b></p>'+
  '<table><tr><th>성공한 곳</th><th>실패한 곳</th></tr><tr><td>장소 · 사건 · 물건을 묶음</td><td>사람에게 점수를 매김</td></tr><tr><td>공개하고 근거를 보임</td><td>몰래 함</td></tr><tr><td>현장이 쓰게 만듦</td><td>위에서만 삼</td></tr><tr><td>법 테두리 안 · 범위 제한</td><td>요건이 넓거나 근거 없음</td></tr><tr><td>결과를 숫자로 잼</td><td>효과를 재지 않거나 비용이 효과를 넘음</td></tr></table>',
  '<p class="small">출처: <a href="https://www.cnbc.com/2018/03/15/new-orleans-ends-its-palantir-predictive-policing-program.html" target="_blank" rel="noopener">CNBC — 뉴올리언스 종료</a> · <a href="https://archive.techdirt.com/articles/20200930/16543945418/palantir-presentations-show-how-lapd-is-able-to-turn-tons-garbage-data-into-ineffective-policing.shtml" target="_blank" rel="noopener">Techdirt — LAPD LASER</a> · <a href="https://www.computing.co.uk/news/2026/government/nhs-palantir-platform-s-business-case-under-scrutiny-as-costs-rise-and-benefits-fall" target="_blank" rel="noopener">Computing — NHS 비용</a> · <a href="https://thenextweb.com/news/palantir-nhs-data-platform-44000-objections-38-degrees" target="_blank" rel="noopener">The Next Web — NHS 이의 4만 4천</a> · <a href="https://www.techradar.com/pro/security/nhs-users-report-that-it-is-awful-to-use-palantir-could-be-forced-to-exit-nhs-after-pushback-from-staff-mps-unions-and-pressure-groups-over-federated-data-platform" target="_blank" rel="noopener">TechRadar — NHS 현장 반응</a> · <a href="https://oecd.ai/en/incidents/2026-05-11-3468" target="_blank" rel="noopener">OECD AI 사건 기록</a></p>']},
 ukr:{h:'우크라이나 — 무엇을 엮어 무엇을 알아냈나',b:[
  '<p>팔란티어가 우크라이나에서 한 일의 핵심은 <b>새 정보를 캐낸 것이 아니라, 이미 있는데 흩어진 자료를 찾아 같은 장소·같은 시각으로 엮은 것</b>입니다. 공개된 범위만 적습니다(전장 활용은 기밀이 많습니다). 「근거」 칸은 그 말이 어디서 나왔는지입니다.</p>'+
  '<table><tr><th>엮은 자료</th><th>알아낸 것 · 한 일</th><th>근거</th></tr>'+
  '<tr><td>상업 위성사진 + AI 판독 + 현장 보고</td><td>적 위치·움직임을 같은 지도 위 「같은 그림」으로 · 표적 판단을 빠르게(마지막 승인은 사람)</td><td>언론 보도(워싱턴포스트)</td></tr>'+
  '<tr><td>러시아 공습 기록(장소·시각·무기)</td><td>공습의 <b>패턴</b>(언제·어디를·무엇으로 반복하나)</td><td>우크라이나 디지털전환부 장관 발언(로이터)</td></tr>'+
  '<tr><td>온라인 게시물·선전물</td><td>허위정보 캠페인 추적</td><td>같은 장관 발언(로이터)</td></tr>'+
  '<tr><td>전쟁범죄 신고 7만 8천 건 + 공개 정보(사진·영상·SNS) + 위성사진</td><td>사건마다 「어디서·언제·무엇이」를 묶어 수사 가능한 형태로</td><td>검찰총장실 협약 보도(2023.4)</td></tr>'+
  '<tr><td>정부기관·민간 단체의 지뢰 조사 자료 + 땅의 쓰임(농지·학교·전력선 둘레)</td><td>지뢰 제거 <b>우선순위</b> — 어디를 먼저 치워야 사람이 돌아오나</td><td>경제부 협약 보도(2024.3) · 화면 흐름은 TIME 보도(팔란티어 명시는 확인 못 함)</td></tr>'+
  '<tr><td>고해상도 위성사진의 포탄 구덩이</td><td>불발탄이 있을 만한 곳의 대리 지표(전선 4만㎢에서 구덩이 250만 개 · 그중 121만 개가 농지)</td><td>미국 메릴랜드대 연구 — 팔란티어와 같이 썼는지는 확인 못 함</td></tr>'+
  '<tr><td>드론 영상 · 감청 · 시민 제보 앱 「e-Enemy」</td><td>하나의 작전 그림으로 합침</td><td>해설 글 수준 — 확인된 보도 아님</td></tr></table>'+
  '<p><b>엮는 방법(공통)</b></p>'+
  '<ol><li><b>찾기</b> — 이미 누군가 갖고 있는 자료부터: 위성 회사 · 기관 기록 · 민간 단체 조사 · 공개 게시물.</li>'+
  '<li><b>같은 자리·같은 때로 맞추기</b> — 좌표와 시각을 공통 열쇠로. 이름이 달라도 같은 자리면 하나로.</li>'+
  '<li><b>관계 긋기</b> — 「이 자리에 포격 → 불발탄 우려 → 이 농지·학교」, 「이 시각 공습 → 이 패턴」.</li>'+
  '<li><b>우선순위와 행동</b> — 어디를 먼저(제거·수사·대응) · 누가 · 결과는.</li></ol>'+
  '<p><b>우리에게 주는 뜻</b>: T-Book과 데이터 압축지도도 같은 일을 합니다 — 경찰 내부 자료가 아니라 이미 공개된 사고(TAAS) · 신호 · 교통량 · 상권 · 인구 자료를 <b>같은 교차로 · 같은 시각</b>으로 묶어 「어디를 먼저」를 봅니다.</p>',
  '<p class="small">출처: <a href="https://euromaidanpress.com/?p=190101" target="_blank" rel="noopener">Washington Post 보도 전재</a> · <a href="https://tech.yahoo.com/ai/articles/ukraines-sees-priceless-digital-battlefield-135206183.html" target="_blank" rel="noopener">로이터(디지털전환부 장관)</a> · <a href="https://fedscoop.com/palantir-to-help-ukraine-process-data-in-war-crimes-investigations/" target="_blank" rel="noopener">FedScoop — 전쟁범죄</a> · <a href="https://me.gov.ua/News/Print/a06dda2b-e995-463e-9ee4-de1613434f44?lang=en-GB" target="_blank" rel="noopener">우크라이나 경제부</a> · <a href="https://www.lcluc.umd.edu/sites/default/files/SergiiSkakun_Day1_ST2023.pdf" target="_blank" rel="noopener">메릴랜드대 연구 자료</a></p>']},
 safe:{h:'치안 데이터의 문제 — 이 앱은 해당 없나요?',b:[
  '<p>실패 사례들은 대부분 <b>치안 데이터를 다룰 때 생기는 문제</b>였습니다. 그 문제를 하나씩 이 앱(T-Book · 온톨로지 · 데이터 압축지도)에 대 보면 이렇습니다.</p>'+
  '<table><tr><th>생길 수 있는 문제</th><th>실패 사례</th><th>이 앱은</th></tr>'+
  '<tr><td>몰래 쓴다</td><td>뉴올리언스</td><td><b>해당 없음</b> — 공개 주소로 여는 앱(확인코드는 울타리일 뿐) · 무엇을 쓰는지 화면마다 출처와 기준일을 적는다</td></tr>'+
  '<tr><td>사람에게 점수를 매긴다</td><td>LA 경찰 LASER</td><td><b>해당 없음</b> — 사람 자료가 없다. 대상은 교차로 · 장소 · 사건 집계뿐. 온톨로지 칸에 차량번호·전화·주민번호 꼴을 넣으면 막는다</td></tr>'+
  '<tr><td>치우친 내부 기록이 되먹임된다</td><td>LA 경찰 LASER</td><td><b>해당 없음</b> — 112·KICS 같은 경찰 내부 기록을 쓰지 않는다. 공공데이터(통계청·국세청·도로교통공단·서울시·경찰청 공개자료)만 · 예외는 서초 교차로 5곳의 신호 계획 출력물(교통과 제공 · 소유자가 공개를 정함 · 사람 정보 없음 · T-Data 실측과 맞춰 본다)</td></tr>'+
  '<tr><td>개인정보·민감정보를 모은다</td><td>영국 NHS</td><td><b>해당 없음</b> — 자료를 모으는 서버가 없다. 적은 것은 그 기기 안에만 남는다(이 온톨로지 화면은 통신 0 · 날씨·실시간 층은 사용자가 켤 때 좌표만 묻는다)</td></tr>'+
  '<tr><td>법적 근거 없이 자료를 엮는다</td><td>독일 헌재</td><td><b>해당 없음</b> — 개인을 식별하는 자료끼리 엮지 않는다. 엮는 것은 누구나 볼 수 있는 공개 통계와 시설 위치다</td></tr>'+
  '<tr><td>위에서 사고 현장이 안 쓴다</td><td>영국 NHS</td><td><b>해당 없음</b> — 현장 교통경찰관이 직접 만들고 매일 쓰며 고친다</td></tr>'+
  '<tr><td>기계가 결정하고 책임이 흐려진다</td><td>전장 표적 AI</td><td><b>해당 없음</b> — 앱은 근거를 보여 줄 뿐, 판단과 조치는 사람이 한다. 추정은 추정이라고 적는다</td></tr></table>'+
  '<p><b>왜 공공데이터만인가요?</b> 내부 자료는 쓸 수 있는 사람이 정해져 있고 밖으로 낼 수 없습니다. 공공데이터는 출처가 분명하고 누구나 다시 확인할 수 있어 <b>결과를 두고 시비를 걸 수 없습니다</b>. 내부 자료 없이도 이 정도를 해낼 수 있다는 것이 이 앱의 요점입니다.</p>'+
  '<p class="small">이 표는 앱이 그렇게 만들어져 있다는 설명입니다. 쓰는 사람이 온톨로지 칸에 실명·사건 내용을 적으면 그 기기 안에는 남으니, 사람이 아니라 상황을 적어 주세요.</p>']},
 dec:{h:'🧭 오늘의 결정 — 데이터지도에서',b:["<p>여기서 배운 온톨로지(교차로·사고·위반·카메라·보호구역·범칙금·판례)를 <b>오늘 무엇을 할지</b>에 쓰는 화면은 데이터 압축지도에 있습니다 — 🧰 도구 맨 위 「🧭 오늘의 결정」.</p>","<p>팔란티어의 <b>결정 화면 → 행동 기록 → 되돌아보기</b>를 그대로 옮겼습니다. 결정 넷: <b>어디 설까</b>(시간대 사고 · 카메라 공백 · 보행자) · <b>🍺 음주</b>(서초서·방배서 적발 요일×시간 + 동 밤 사고) · <b>📢 집회·행사</b>(둘레 교차로 + 먼저 끊을 상류) · <b>🌧 큰비</b>(잠긴 길 · 출동 지연). 후보마다 근거가 붙고, 범칙금 글은 T-Book 글 그대로입니다.</p>","<p>「✋ 여기 섰다」로 한 일을 남기면 <b>그 기기에만</b> 저장됩니다(사람·차량번호 꼴은 거절). 「📒 기록」에서 1순위가 아닌 곳을 고른 까닭을 모아 보면 — 그것이 형님 현장 판단이고, 다음 규칙이 됩니다. 판단은 사람이 합니다.</p>","<p>왜 그런지(근거 사슬)를 먼저 보고 싶으면 「🧩 엮어서 답 찾기」 — 두 화면은 지도 안에서 서로 이어집니다.</p><p><a style=\"display:inline-block;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:700;text-decoration:none\" href=\"https://340patrolman.github.io/datamap/#orc=1&amp;tbk=796815f0c98a\" target=\"_blank\" rel=\"noopener\">🧩 엮어서 답 찾기 — 지도에서 해 보기 (새 탭)</a></p>","<p><a style=\"display:inline-block;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:700;text-decoration:none\" href=\"https://340patrolman.github.io/datamap/#dec=1&amp;tbk=796815f0c98a\" target=\"_blank\" rel=\"noopener\">🧭 오늘의 결정 열기 (데이터지도 · 새 탭)</a></p>"]},
 weave:{h:'🧩 엮어서 답 찾기 — 네 걸음',b:["<p>형님 말씀이 맞습니다. 팔란티어 방식의 핵심은 <b>새 자료를 캐는 것이 아니라, 이미 흩어져 있는 공개 자료를 같은 열쇠로 다시 엮는 것</b>입니다. 그리고 엮는 일은 사람이 매번 짜지 않아도 되게 <b>「질문 레시피」</b>로 만들어 둘 수 있습니다 — 질문을 고르면 레시피가 자료를 차례로 붙여 답의 사슬을 보여 줍니다.</p><table><tr><th>걸음</th><th>하는 일</th></tr><tr><td><b>① 무엇이 있나</b></td><td>대상을 정한다 — 학교·역·동·교차로·경찰서처럼 「이름 붙은 것」. 자료 파일의 한 줄이 대상 하나다.</td></tr><tr><td><b>② 무엇과 이어지나</b></td><td>같은 자리(좌표·행정동·관할), 같은 때(날짜·시각), 같은 코드(학교 ID·교차로 번호)로 다른 자료를 붙인다. 이것이 「엮기」다 — 새 자료를 캐는 것이 아니라 흩어진 공개 자료를 같은 열쇠로 모은다.</td></tr><tr><td><b>③ 그래서 무엇을 하나</b></td><td>모인 값을 사람이 판단하기 쉽게 문장으로 — 갈래마다 따로 보이고 한 점수로 합치지 않는다. 문턱이 있으면 그 출처를 같이 적는다.</td></tr><tr><td><b>④ 해 보고 다시 적는다</b></td><td>한 일과 결과를 남기면 다음 판단의 근거가 된다(온톨로지 「조치」). 개인정보는 적지 않는다 — 사람이 아니라 상황을 적는다.</td></tr></table><p><b>열쇠 세 가지</b> — 같은 <b>자리</b>(좌표 · 행정동 · 관할) · 같은 <b>때</b>(날짜 · 시각) · 같은 <b>코드</b>(학교 ID · 교차로 번호). 이 셋 중 하나만 맞아도 두 자료를 이을 수 있습니다.</p><p class=\"small\">이은 값에는 등급을 붙입니다 — <b>A</b> 원자료에 그대로 있는 값 · <b>B</b> 원자료끼리 코드·이름으로 맞댄 값 · <b>C</b> 자리 거리로 붙인 어림(몇 m 안). 한 점수로 더하지 않고 갈래마다 따로 봅니다.</p>","<p><b>질문 레시피 열</b> — 데이터 압축지도와 같은 레시피입니다(지도에서 대상을 누르면 그 대상 값으로 셈합니다).</p><table><tr><th>질문</th><th>엮는 차례</th><th>누가</th></tr><tr><td><b>이 학교 둘레 — 등하교 때 무엇을 봐야 하나</b></td><td>관할 → 어린이보호구역 → 학교 둘레 업소 → 그 동 교통사고 → 학령 인구 → 학사 일정</td><td>여청 · 교통 · 학부모</td></tr><tr><td><b>공연·집회가 끝나는 시각 — 어느 역 출구가 붐비나</b></td><td>오늘 앞뒤 행사 → 그 역 평소 혼잡 → 집회 원문</td><td>경비 · 교통 · 지역경찰</td></tr><tr><td><b>오늘 밤 술자리가 몰리는 동 — 어디를 볼까</b></td><td>술자리 바탕 → 밤 사고 → 올빼미버스 내리는 곳 → 관할</td><td>교통 · 지역경찰</td></tr><tr><td><b>큰비로 길이 막히면 — 출동이 어디서 얼마나 늦나</b></td><td>늦어지는 교차로 → 그 자리 119 센터</td><td>지역경찰 · 소방 · 교통</td></tr><tr><td><b>이 동 외국인 주민 — 어떤 외사 업무가 생길까</b></td><td>외국인 주민 갈래 → 주민 대비 → 구 안에서 어디쯤</td><td>외사 · 여청 · 지역경찰</td></tr><tr><td><b>집회 행진이 끝나는 곳 — 어느 교차로를 볼까</b></td><td>행진 경로 → 끝 자리 둘레 교차로 → 그 교차로 신호 자료</td><td>경비 · 교통</td></tr><tr><td><b>이 동 가게가 늘고 줄고 — 무엇이 달라지고 있나</b></td><td>업종 조기 신호 → 서울 상권분석과 맞대기 → 입주 예정 단지</td><td>정보 · 생활안전 · 지역경찰</td></tr><tr><td><b>신고 차량이 빠져나갈 곳 — 어느 관서에 먼저 알리나</b></td><td>출발 길 → 앞에 나오는 진출로 → 빠지면 닿는 길 → 그 자리 관할</td><td>지역경찰 · 교통 · 상황실</td></tr><tr><td><b>지금 사람이 몰리는 곳 — 몇 시까지 붐비나</b></td><td>지금 붐빔 → 앞으로 12시간 → 가까운 역 평소 혼잡</td><td>경비 · 지역경찰 · 교통</td></tr><tr><td><b>이 동 어르신 — 실종·보행 사고를 어디서 볼까</b></td><td>어르신 인구 → 보행 사고 → 119 신변·위치 확인 출동</td><td>지역경찰 · 여청 · 교통</td></tr></table>","<p><b>실제로 엮어 보면</b> — 「이 학교 둘레 — 등하교 때 무엇을 봐야 하나」 / 대상: <b>서울원명초등학교</b> (자료 날짜 2026-10-23 · 데이터 압축지도 data/onto-recipes.json 값 그대로)</p><table><tr><th>걸음</th><th>엮어 나온 값</th><th>등급</th></tr><tr><td>관할</td><td>서울서초경찰서 · 서초3(근사) · 반포1동</td><td>B</td></tr><tr><td>어린이보호구역</td><td>있음(원명) · CCTV 대수 자료 없음 · 도로 폭 자료 없음</td><td>B</td></tr><tr><td>학교 둘레 업소(200m 어림)</td><td>없음</td><td>C</td></tr><tr><td>그 동 교통사고</td><td>한 해 평균 184.6건 · 보행자 피해 10년 427명</td><td>A</td></tr><tr><td>학령 인구</td><td>초등 나이 2395 · 중 1444 · 고 1137명 (202609 기준)</td><td>A</td></tr><tr><td>학사 일정</td><td>다음 큰 날 2026-11-19 (수능날) — 재량휴업 254교</td><td>A</td></tr></table><p><b>판단할 때</b> — 값을 갈래마다 따로 보인다. 업소가 반경 안에 있다고 위반이 아니다(상대구역은 심의로 허용된 곳·학교보다 먼저 있던 곳이 섞인다). 보호구역 CCTV 0대는 「자료에 0」이지 「없다」가 아닐 수 있다.</p><p><b>할 일</b></p><ol><li>등교 07:50~08:40 · 하교 13:00~15:30 횡단보도·보호구역 진입로에서 서행 지도</li><li>CCTV 가 적은 보호구역은 순찰 차례 앞으로</li><li>업소 밀집 쪽 하교길은 학교전담경찰관과 공유</li><li>방학·재량휴업 날은 등하교 배치를 줄인다</li></ol><p><b>하나 더</b> — 「오늘 밤 술자리가 몰리는 동 — 어디를 볼까」 / 대상: <b>서초4동</b></p><table><tr><th>걸음</th><th>엮어 나온 값</th><th>등급</th></tr><tr><td>술자리 바탕</td><td>주점 53곳 · 호프 매출 중 21~06시 59% · 0~6시 결제 6581건/달</td><td>A</td></tr><tr><td>서울 동 가운데 백분위</td><td>주점 수 80 · 호프 매출 92 · 0~6시 결제 93 · 밤 사고 91 · 0~6시 사고 95</td><td>A</td></tr><tr><td>밤 사고(10년)</td><td>1319건 중 밤 20~6시 477 · 0~6시 234</td><td>A</td></tr><tr><td>올빼미버스 내리는 곳(700m)</td><td>지하철2호선강남역(한 달 하차 3037) · 강남역8번출구(한 달 하차 2251)</td><td>C</td></tr><tr><td>관할</td><td>서울서초경찰서</td><td>B</td></tr></table><p class=\"small\">백분위를 갈래마다 따로 보인다(합친 점수 없음). 결제한 사람이 운전한다는 뜻이 아니다 — 술자리가 몰리는 시간과 자리를 아는 바탕이다.</p>","<p><b>손으로 해 보기 — 빈칸 넷만 채우면 됩니다</b></p><table><tr><th>빈칸</th><th>예(학교 둘레)</th></tr><tr><td>① 대상 하나</td><td>○○초등학교</td></tr><tr><td>② 그 대상에 붙일 자료 셋 — 열쇠는?</td><td>보호구역(학교 이름) · 둘레 업소(200m 자리) · 그 동 사고(행정동)</td></tr><tr><td>③ 그래서 무엇을 하나</td><td>하교 시간 보호구역 진입로 서행 지도</td></tr><tr><td>④ 해 보고 적기</td><td>날짜 · 한 일 · 결과(사람 이름 없이)</td></tr></table><p>이 앱의 「바로 내 문제에 써 보기」가 바로 이 빈칸을 버튼 문답으로 채우는 길입니다. 자료가 붙은 것을 보고 싶으면 <b>데이터 압축지도</b>에서 학교·역·동·교차로·집회·인파 장소를 눌러 「🧩 엮어서 답 찾기」를 고르면 됩니다(학교·역·출동 지연 카드 맨 위 🧩 단추 · 동 카드 맨 위 단추 묶음(밤 술자리·외국인 주민·가게 늘고 줄고·어르신) · 행진 집회 카드 「행진 끝 교차로」 · 실시간 인파 장소 카드 · 「🚨 신고 차량 예측」 결과 아래 「어느 관서에 먼저 알리나」 · 도구 모음에도 있음).</p><p class=\"small\">지킬 것: 「위반」「위험 지역」으로 단정하지 않는다 · 사람 정보(이름·차량번호·연락처)는 엮지 않는다 · 어림(등급 C)은 어림이라고 적는다.</p>","<p><a style=\"display:inline-block;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:700;text-decoration:none\" href=\"https://340patrolman.github.io/datamap/#orc=1&amp;tbk=796815f0c98a\" target=\"_blank\" rel=\"noopener\">🧩 엮어서 답 찾기 — 지도에서 해 보기 (새 탭)</a></p>"]},
 eff:{h:'효과는 무엇인가요?',b:[
  '<ul><li><b>같은 말을 쓰게 된다</b> — 부서마다 다르게 부르던 것이 한 이름이 됩니다.</li>'+
  '<li><b>연결된 질문에 답한다</b> — "이 정체의 원인은 어디서 오나", "이 업무가 막히면 누가 기다리나".</li>'+
  '<li><b>결정의 이유가 남는다</b> — 액션 기록 덕분에 담당자가 바뀌어도 "왜"가 남습니다.</li>'+
  '<li><b>AI가 지어내지 않는다</b> — 문서 더미에서 비슷한 문장을 찾는 대신, 지도에서 근거를 찾아 답합니다.</li>'+

/* ---------- 상태 ---------- */
function blankB(){return{id:'o'+Date.now(),dom:null,title:'',q:{decision:'',now:''},types:[],links:[],actions:[],funcs:[],changed:null,changeWhy:'',saved:null,log:[],snaps:[]};}

function norm(B){B=B||blankB();['types','links','actions','funcs','log','snaps'].forEach(function(k){if(!Array.isArray(B[k]))B[k]=[];});if(!B.q)B.q={decision:'',now:''};return B;}
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){toast('저장 공간이 부족합니다');}}

ST.B=norm(ST.B);if(!ST.tmp)ST.tmp={};if(!ST.undo)ST.undo=[];

/* v4 — 개인을 알아볼 수 있는 형태(차량번호·휴대전화·주민등록번호). 형식만 잡으니 날짜·장소가 구체적이면 그것도 사람을 드러낸다 */
var PII=[/\d{2,3}\s?[가-힣]\s?\d{4}/g,/01[016789][-.\s]?\d{3,4}[-.\s]?\d{4}/g,/\d{6}[-\s]?[1-8]\d{6}/g];
function hasPII(v){return PII.some(function(r){r.lastIndex=0;return r.test(v);});}
function scrubPII(v){PII.forEach(function(r){r.lastIndex=0;v=v.replace(r,'○○');});return v;}
/* 넣기 전에 묻는다 — 확인: ○○로 바꿔 넣음 · 취소: 넣지 않고 칸으로 돌아감(null) */
function piiGate(v){if(!v||!hasPII(v))return v;
  return confirm('개인을 알아볼 수 있는 정보(차량번호·전화번호·주민번호 형태)가 있습니다. 지우고 넣을까요?\n\n[확인] 그 부분을 ○○로 바꿔 넣기\n[취소] 넣지 않고 고치러 돌아가기')?scrubPII(v):null;}
function persist(){var c={msgs:ST.msgs.slice(-160),node:ST.node,B:ST.B,tmp:ST.tmp,sel:[],lastB:ST.lastB||null,undo:ST.undo.slice(-15)};save('onto3_state',c);}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(p){return (p||'x')+Math.random().toString(36).slice(2,8);}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},1900);}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function copyText(txt){function fb(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);toast(ok?'복사했습니다':'복사 실패 — 길게 눌러 직접 복사하세요');}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(function(){toast('복사했습니다');},fb);else fb();}

/* ---------- v4.2 교통 온톨로지 코어 v1(서초) — 위 tbcore 블록을 읽어 지도로 시작한다 ----------
   값은 다시 셈하지 않고 블록 그대로 쓴다(사고 해마다·주 위반 건수·조문·판례·조치). 여기서 하는 셈은 조치 앞뒤 2해 사고 합(데이터 압축지도 관계 패널과 같은 규칙)뿐 */
var CORE=null;
function core(){if(CORE)return CORE;var el=document.getElementById('tbcore');if(!el)return null;
  try{var c=JSON.parse(el.textContent),O={},out={},inn={};c.objects.forEach(function(o){O[o.id]=o;});
    c.edges.forEach(function(e){(out[e[0]]=out[e[0]]||[]).push(e);(inn[e[2]]=inn[e[2]]||[]).push(e);});CORE={c:c,O:O,out:out,inn:inn};}catch(e){CORE=null;}return CORE;}
function cf(id,rel){var K=core();return (K.out[id]||[]).filter(function(e){return e[1]===rel;}).map(function(e){return{o:K.O[e[2]],p:e[3]||{}};});}
function cb(id,rel){var K=core();return (K.inn[id]||[]).filter(function(e){return e[1]===rel;}).map(function(e){return{o:K.O[e[0]],p:e[3]||{}};});}
function cAcc(id){var a=cf(id,'발생')[0];return a?a.o:null;}
function cSum(a){var s=0;(a||[]).forEach(function(v){s+=v;});return s;}
function cWhy(t){return /^이력 글에 이유가/.test(t||'')?'이력에 적혀 있지 않다(내부 문서)':(t||'');}
function cCmp(A,ym){var y=ym?+String(ym).slice(0,4):null;if(!y)return{n:'이력 글에 연·월이 없다'};if(!A)return{n:'둘레 사고 칸이 없다'};
  function yr(k){var i=k-A.y0;return i>=0&&i<A.years.length?A.years[i]:null;}var b=[yr(y-2),yr(y-1)],f=[yr(y+1),yr(y+2)];
  if(b[0]==null||b[1]==null)return{n:'앞 두 해 자료가 없다(TAAS '+A.y0+' 부터)'};
  if(f[0]==null||f[1]==null)return{n:'뒤 두 해가 아직 지나지 않았다(TAAS '+(A.y0+A.years.length-1)+' 까지)'};
  return{b:b[0]+b[1],f:f[0]+f[1],s:'사고 앞 2해('+(y-2)+'·'+(y-1)+') '+(b[0]+b[1])+'건 → 뒤 2해('+(y+1)+'·'+(y+2)+') '+(f[0]+f[1])+'건'};}
function cActs(id){var A=cAcc(id);return cb(id,'대상').map(function(x){var r=cf(x.o.id,'근거기록')[0];return{a:x.o,why:r?cWhy(r.o.text):'',c:cCmp(A,x.o.ym)};})
  .sort(function(p,q){return String(p.a.ym||'9999').localeCompare(String(q.a.ym||'9999'));});}
function cVio(id){var A=cAcc(id);return A?cf(A.id,'주요원인').map(function(x){return{o:x.o,n:x.p.n||0};}).sort(function(p,q){return q.n-p.n;}):[];}
function cInts(){var K=core();if(!K)return[];return K.c.objects.filter(function(o){return o.t==='INT';}).map(function(o){var A=cAcc(o.id);return{o:o,n:A?cSum(A.years):0,a:cb(o.id,'대상').length};})
  .sort(function(p,q){return (q.a?1:0)-(p.a?1:0)||q.n-p.n;});}
function coreCard(id){var K=core(),it=K.O[id],A=cAcc(id),v=cVio(id),h='<b class="h">🧩 '+esc(it.nm)+'</b><p class="small">'+(it.cits?'신호 '+esc(it.cits)+' · ':'')+esc(it.dongnm||'')+' · 교통 온톨로지 코어 v1(서초 · '+esc(String(K.c.core_made||'').slice(0,10))+')</p>';
  if(A){var t=cSum(A.years);h+='<p><b>① 사고 — 해마다</b> <span class="small">(2016~2025 · 둘레 '+A.r+'m 안 100m 칸 '+A.cells+'개 · 근사)</span></p><table class="yt"><tr>'+A.years.map(function(x,i){return '<th>'+String(A.y0+i).slice(2)+'</th>';}).join('')+'</tr><tr>'+A.years.map(function(x){return '<td>'+x+'</td>';}).join('')+'</tr></table>'
    +'<p class="small">10년 '+t+'건 · 사망 '+A.dead+' · 중상 '+A.serious+' · 보행자 '+A.ped+' · 밤(20~6시) '+A.night+'건('+(t?Math.round(A.night/t*100):0)+'%)</p>';}
  else h+='<p class="small">둘레 70m 안에 사고 칸이 없다(TAAS 2016~2025).</p>';
  if(v.length){h+='<p style="margin-top:8px"><b>② 주 위반 → 근거</b></p><p>'+v.slice(0,3).map(function(x,i){return (i?'':'<b>')+esc(x.o.nm)+(i?'':'</b>')+' <span class="small">('+x.n+'건)</span>';}).join(' · ')+'</p>';
    var L=cf(v[0].o.id,'근거');if(L.length)L.forEach(function(l){var P=cf(l.o.id,'해석');h+='<div class="log"><b>'+esc(l.o.title)+'</b><br><span class="small">'+esc(l.o.meta)+'</span>'+(l.o.penalty?'<br>'+esc(l.o.penalty):'')+(P.length?'<br><span class="small">판례 '+P.map(function(p){return esc(p.o.court+' '+p.o.date+' '+p.o.no);}).join(' · ')+'</span>':'')+'</div>';});
    else h+='<p class="small">T-Book 범칙금 DB 에 「'+esc(v[0].o.nm)+'」와 같은 항목이 없다(지어 넣지 않음).</p>';}
  var cm=cf(id,'보유'),zn=cf(id,'가까움').sort(function(p,q){return (p.p.d||0)-(q.p.d||0);});
  h+='<p style="margin-top:8px"><b>③ 시설</b></p><p class="small">📷 경찰 단속 카메라(100m 안) '+cm.length+(cm.length?' — '+cm.map(function(c){return esc((c.o.road||'')+' 제한 '+c.o.lim);}).join(' · '):'')+'<br>🏫 어린이보호구역 시설(300m 안) '+zn.length+(zn.length?' — '+zn.slice(0,3).map(function(z){return esc(z.o.nm||z.o.kind)+(z.p.d!=null?' '+z.p.d+'m':'');}).join(' · '):'')+'</p>';
  var ac=cActs(id);h+='<p style="margin-top:8px"><b>④ 과거 조치 — 왜 바꿨고 어떻게 됐나</b></p>'+(ac.length?ac.map(function(x){return '<div class="log"><span class="small">'+esc(x.a.ym||'때 모름')+'</span><br><b>'+esc(x.a.what)+'</b><br>이유: '+esc(x.why||'—')+'<br><span class="small">'+esc(x.c.s||x.c.n)+'</span></div>';}).join(''):'<p class="small">이 교차로의 조치 이력 자료는 없다(교통과 출력물 5곳만 있다).</p>');
  return h+'<p class="small">근거 — TAAS 2016~2025(100m 칸 · 둘레 칸을 묶은 근사) · 경찰 단속 카메라·어린이보호구역(행정안전부 표준데이터) · 조치 = 서초서 교통과 신호 출력물 이력(5곳 — 소유자가 공개를 정한 출력물) · 조문·범칙금 = T-Book 범칙금 DB 글 그대로 · 판례 = 원문 대조된 것만 · 사고는 해 단위라 같은 해 조치가 여럿이면 어느 조치 덕인지 가르지 못한다.</p>';}
/* 코어의 한 교차로를 이 앱의 지도(B)로 — 교차로·위반유형·법규 항목·판례·시설은 대상, 코어 링크는 선, 교통과 조치는 액션 */
function coreB(id){var K=core(),it=K.O[id],A=cAcc(id),B=blankB(),has=cb(id,'대상').length;
  B.dom='traffic';B.title=it.nm+' — 사고를 무엇부터 줄일까';B.q={decision:B.title,now:'자료·숫자'};B.core=id;
  function T(n,p){var t={id:uid('t'),name:n,props:p.map(function(x){return{name:x[0],src:x[1]};}),objs:[]};B.types.push(t);return t;}
  function O(t,n){var o={id:uid('b'),name:n,vals:{}};t.objs.push(o);return o.id;}
  function Lk(a,r,b){B.links.push({id:uid('l'),from:a,rel:r,to:b});}
  var tX=T('교차로',[['10년 사고(TAAS)','공공데이터'],['밤 사고 몫','공공데이터'],['신호 운영',has?'내부자료':'아직 모름']]),x=O(tX,it.nm);

    if(l.rel)s+='<text x="'+((a.x+b.x)/2)+'" y="'+((a.y+b.y)/2-4)+'" font-size="13" text-anchor="middle" fill="var(--sub)" paint-order="stroke" stroke="var(--bg)" stroke-width="4">'+esc(l.rel)+'</text>';});
  Object.keys(pos).forEach(function(id){var p=pos[id],c='var('+COLORS[p.n.ti%4]+')',act=ST.B.actions.some(function(a){return a.target===id;});

  L.push('','■ 판단 규칙');B.funcs.forEach(function(f){L.push('  '+f.when+' → '+f.then+' (자료: '+(f.need||'미정')+')'+(f.src?' [출처: '+f.src+']':''));});
  var g=gaps();L.push('','■ 빈 곳 ('+g.length+')');g.forEach(function(x){L.push('  - '+x);});
  if(B.snaps.length>1)L.push('  저장할 때마다 빈 곳: '+B.snaps.map(function(x){return x.g;}).join(' → '));
  if(B.log.length){L.push('','■ 자라 온 기록 ('+B.log.length+')');B.log.forEach(function(x){L.push('  '+x.d+' '+x.w);});}
  if(B.changed)L.push('','결정 변화: '+B.changed+(B.changeWhy?' — '+B.changeWhy:''));return L.join('\n');}
/* v4.1 — AI 에 붙여 넣어 검토받을 때 앞에 붙이는 말(T-Book 서식·메모 › 온톨로지의 「AI용 복사」와 같은 글) */
var AI_HEAD='[T-Book 온톨로지 지도 — AI 검토 요청]\n아래는 경찰관이 현장 문제를 온톨로지(대상·속성·관계·액션·판단 규칙)로 정리한 것입니다. 다음을 짚어 주세요.\n1) 「빈 곳」을 어떤 자료로 메울 수 있는지(공개 자료면 이름까지)\n2) 빠진 대상·관계\n3) 다음에 해 볼 액션과 그 결과를 무엇으로 확인할지\n4) 판단 규칙의 허점이나 예외\n추측은 추측이라고 밝히고, 법령·판례는 조문·사건번호를 확인할 수 있을 때만 적어 주세요.\n----\n';
function cq(s){s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function asCSV(){var O=[['id','타입','이름']],K=[['출발','관계','도착']],A=[['날짜','액션','대상','권한','왜','결과']];
  allObjs().forEach(function(x){O.push([x.o.id,x.t.name,x.o.name]);});ST.B.links.forEach(function(l){K.push([l.from,l.rel,l.to]);});
  ST.B.actions.forEach(function(a){A.push([a.plan?'계획':a.date,a.name,a.target,a.who,a.why,a.result]);});
  function j(r){return r.map(function(x){return x.map(cq).join(',');}).join('\n');}
  return '# objects.csv\n'+j(O)+'\n\n# links.csv\n'+j(K)+'\n\n# actions.csv\n'+j(A);}
function saveHist(){var B=ST.B;B.saved=today()+' '+new Date().toTimeString().slice(0,5);
  var sp={d:today(),g:gapsX().length,o:allObjs().length,l:B.links.length,a:B.actions.length},ls=B.snaps[B.snaps.length-1];
  if(!B.log.length)addLog('처음 지도 — 대상 '+sp.o+' · 선 '+sp.l+' · 액션 '+sp.a);
  if(ls&&ls.g===sp.g&&ls.o===sp.o&&ls.l===sp.l&&ls.a===sp.a)ls.d=sp.d;else{B.snaps.push(sp);if(B.snaps.length>30)B.snaps=B.snaps.slice(-30);}
  var k=JSON.parse(JSON.stringify(B));
  HIST=HIST.filter(function(x){return x.id!==k.id;});HIST.push(k);if(HIST.length>60)HIST=HIST.slice(-60);save('onto3_history',HIST);toast('기록에 저장했습니다');}
function example(){var B=blankB();B.dom='traffic';B.title='평일 15:30 성모병원사거리 정체를 어디서 먼저 끊을까';B.q={decision:B.title,now:'경험과 감'};
  function T(n,p){var t={id:uid('t'),name:n,props:p.map(function(x){return{name:x[0],src:x[1]};}),objs:[]};B.types.push(t);return t;}
  function O(t,n){var o={id:uid('b'),name:n,vals:{}};t.objs.push(o);return o.id;}
  var X=T('교차로',[['정체 시간대','현장관찰'],['신호 운영','내부자료'],['통행속도','아직 모름']]),C=T('원인시설',[['몰리는 시각','현장관찰'],['수업 시각','아직 모름']]),R=T('도로·분기점',[['소화량','내부자료'],['우회 가능','현장관찰']]);
  var sm=O(X,'성모병원사거리'),hg=O(C,'삼호가든·궁전 학원가'),sp=O(R,'사평대로'),sj=O(R,'사평지하차도');
  B.links=[{id:uid('l'),from:hg,rel:'차량을 보낸다',to:sm},{id:uid('l'),from:sm,rel:'대기를 넘긴다',to:sp},{id:uid('l'),from:sj,rel:'우회로가 된다',to:sm}];
  B.actions=[{id:uid('a'),name:'직좌 동시신호 후 5초 뒤 좌회전만, 19시까지',plan:false,target:sm,who:'시설담당(배분값)',date:'',why:'학원차·학부모 차량이 사평지하차도 대신 상부로 몰려 꼬리물기. 사평대로 소화량 기준',result:'체감 개선 — 통행속도 전후 비교는 아직'}];
  B.funcs=[{when:'하류(사평대로)가 받아줄 수 없을 때',then:'정체 출발점이 아니라 상류에서 먼저 끊는다',need:'사평대로 대기 길이, 시간대별 통행속도'}];return B;}

/* ---------- 그리기·진행 ---------- */
var msgs=document.getElementById('msgs'),ctl=document.getElementById('ctlin'),logEl=document.getElementById('log');
function push(who,html){ST.msgs.push({w:who,h:html});}
function drawMsgs(){msgs.innerHTML=ST.msgs.map(function(m){return '<div class="msg '+m.w+'"><div class="bub'+(m.h.indexOf('class="map"')>-1||m.h.indexOf('<table')>-1?' wide':'')+'">'+m.h+'</div></div>';}).join('');
  requestAnimationFrame(function(){logEl.scrollTop=logEl.scrollHeight;});}
var CUR=null;
function enter(id){
  if(typeof id==='function')id=id();
  if(id==='hist'||id==='start'){ST.tmp={};}
  if((id.indexOf('b.')===0&&id!=='b.end'&&id!=='b.end2')||id.indexOf('g.')===0)ST.lastB=id;else if(id.indexOf('grow')===0)ST.lastB='grow.r';else if(id==='start'||id==='b.end'||id==='b.end2'||id==='ex')ST.lastB=null;
  ST.node=id;var n=N(id);CUR=n;ST.sel=[];
  (n.say||[]).forEach(function(s){push('bot',s);});
  if(n.auto){persist();return enter(n.auto);}
  persist();drawMsgs();drawCtl();
}
function drawCtl(){var u=CUR.ui||{},h='';
  if(u.multi){h+='<div class="choices">'+u.multi.map(function(x,i){return '<button type="button" class="ch tg" data-tg="'+i+'" aria-pressed="false">'+esc(x)+'</button>';}).join('')+'</div>';}
  if(u.choices&&u.choices.length){h+='<div class="choices"'+(u.multi?' style="margin-top:8px"':'')+'>'+u.choices.map(function(c,i){return '<button type="button" class="ch'+(c.sub?' sub':'')+'" data-c="'+i+'">'+esc(c.l)+'</button>';}).join('')+'</div>';}
  if(u.input){h+='<div class="inrow"><input type="text" id="inp" placeholder="'+esc(u.input.ph)+'" enterkeyhint="send" aria-label="'+esc(u.input.ph)+'">'+(u.next?'':'<button type="button" class="ch go" id="send">보내기</button>')+'</div>';}
  if(u.next)h+='<div class="choices" style="margin-top:8px"><button type="button" class="ch go" id="nx">다음</button></div>';
  h+='<div class="tools"><span>'+(u.why?'<button type="button" id="why">왜 이걸 묻나요?</button>':'')+'</span><button type="button" id="undo"'+(ST.undo.length?'':' hidden')+'>되돌리기</button></div>';
  ctl.innerHTML=h;}
function snap(){ST.undo.push(JSON.stringify({msgs:ST.msgs,node:ST.node,B:ST.B,tmp:ST.tmp,lastB:ST.lastB||null}));if(ST.undo.length>15)ST.undo.shift();}
function answer(label,fn,go){snap();push('me',esc(label));if(fn)fn();enter(go);}
ctl.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var u=CUR.ui||{};
  if(b.dataset.c!=null){var c=u.choices[+b.dataset.c];answer(c.l,c.fn,c.go);return;}
  if(b.dataset.tg!=null){var on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);var v=u.multi[+b.dataset.tg];
    if(on)ST.sel.push(v);else ST.sel=ST.sel.filter(function(x){return x!==v;});return;}
  if(b.id==='send'){submitInput();return;}
  if(b.id==='nx'){var ex=(document.getElementById('inp')||{}).value||'';if(ex){ex=piiGate(ex);if(ex===null)return;}snap();var lbl=ST.sel.concat(ex.split(',').map(function(s){return s.trim();}).filter(Boolean)).join(', ')||'(없음)';
    var go=u.next(ST.sel.slice(),ex);if(go===false){ST.undo.pop();return;}push('me',esc(lbl));enter(go);return;}
  if(b.id==='why'){push('bot','<div class="pal">'+esc(WHY[u.why])+'</div>');persist();drawMsgs();return;}
  if(b.id==='undo'){var s=ST.undo.pop();if(!s)return;var o=JSON.parse(s);
    ST.msgs=o.msgs;ST.B=o.B;ST.tmp=o.tmp;ST.node=o.node;ST.lastB=o.lastB;CUR=N(o.node);ST.sel=[];persist();drawMsgs();drawCtl();return;}
});
function submitInput(){var u=CUR.ui||{},el=document.getElementById('inp');if(!el)return;var v=el.value.trim();if(!v){toast('내용을 적어 주세요');return;}
  v=piiGate(v);if(v===null){el.focus();return;}
  answer(v,function(){u.input.fn(v);},u.input.go);}
ctl.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='inp'&&!e.isComposing){e.preventDefault();if(CUR.ui&&CUR.ui.next)document.getElementById('nx').click();else submitInput();}});
msgs.addEventListener('click',function(e){var b=e.target.closest('button[data-act]');if(!b)return;var a=b.dataset.act;
  if(a==='ai')copyText(AI_HEAD+asText());else if(a==='txt')copyText(asText());else if(a==='csv')copyText(asCSV());else if(a==='json')copyText(JSON.stringify(ST.B));else if(a==='save')saveHist();});
document.getElementById('home').addEventListener('click',function(){if((ST.node.indexOf('b.')===0||ST.node.indexOf('g.')===0||ST.node.indexOf('grow')===0)&&ST.node!=='b.end'&&ST.node!=='b.end2'&&!confirm('처음으로 갈까요? 작성 중인 내용은 "되돌리기"로만 돌아올 수 있습니다.'))return;
  snap();ST.msgs=[];enter('start');});
document.getElementById('thm').addEventListener('click',function(){var r=document.documentElement,c=r.getAttribute('data-theme'),dk=c?c==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.setAttribute('data-theme',dk?'light':'dark');save('onto3_theme',r.getAttribute('data-theme'));});

var th=load('onto3_theme',null);if(th)document.documentElement.setAttribute('data-theme',th);
/* v4 — T-Book 에서 바로 들어오는 문: #field(지난 현장 복기) · #learn(배우기). 하던 대화는 「되돌리기」에 남기고 새로 연다 */
var hsh=(location.hash||'').slice(1);
/* v4.1 — T-Book 서식·메모 › 🧭 온톨로지에서 기록 하나를 골라 열면 #open=아이디 — 그 지도를 「이어서 키우기」로 연다 */
var hop=/^open=([\w-]+)$/.exec(hsh), hrec=hop&&HIST.filter(function(h){return h.id===hop[1];})[0];
if(hrec){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(ST.msgs.length)snap();ST.msgs=[];ST.B=norm(JSON.parse(JSON.stringify(hrec)));ST.tmp={};enter('grow');}
else if(/^core(=INT-\d+)?$/.test(hsh)&&core()){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(ST.msgs.length)snap();ST.msgs=[];var hci=hsh.split('=')[1];if(hci&&core().O[hci]){ST.tmp={ci:hci};enter('core.i');}else enter('core');}
else if(hsh==='field'||hsh==='learn'){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(ST.msgs.length)snap();ST.msgs=[];
  if(hsh==='field'){ST.B=blankB();ST.B.dom='field';ST.tmp={};push('bot','<p>T-Book 현장심리에서 왔습니다. 지난 현장 하나를 <b>상황 단위로</b> 복기합니다 — 어디서 꼬였고, 무엇이 통했고, 다음엔 무엇을 할지.</p>');enter('b.q');}
  else enter('L:what');}
else if(ST.msgs.length){CUR=N(ST.node);drawMsgs();drawCtl();}else enter('start');
})();
