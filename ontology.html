<title>온톨로지 · 팔란티어 방식 · T-Book</title>
<!--
  온톨로지 ver.4 (T-Book 서브앱) — 버튼 문답으로 배우고, 같은 문답으로 내 문제의 온톨로지를 만든다.
  배우기: 온톨로지란 / 왜 필요한가 / 팔란티어는 어떻게 푸나 / 효과 / 한계 / 나·우리·직장·교통에 쓰는 법 / 디지털 트윈이란 / 나를 알아가는 법
  만들기: 영역 → 결정 질문 → 오브젝트 타입·대상·속성·출처 → 링크 → 액션 → 함수 → 결과(지도·빈 곳·기록)
  v4(2026-10-02): 이어서 키우기(빈 곳 메우기·결과 채우기·새 액션·선·대상·규칙 → 자라 온 기록 B.log · 빈 곳 변화 B.snaps)
    · 영역 「현장 대응」(지난 현장 복기 — 판단 규칙 예시는 T-Book 현장심리 카드 원칙 그대로 + 출처 카드 이름)
    · 개인정보 형태(차량번호·전화·주민번호) 입력 경고 · 바로가기 주소 #field(현장 대응 첫 질문) · #learn(배우기 첫 주제)
  단일 파일. 서버 없음. 외부 전송 없음(connect-src none). 저장은 이 기기 localStorage(onto3_*)에만.
  주석에 꺾쇠 기호를 쓰지 않는다(T-Book 계약서 관례).
-->
<style>
:root{--bg:#EEF1F5;--card:#FFF;--ink:#16202E;--sub:#4A5668;--line:#D3D9E2;--me:#2448C8;--meink:#FFF;
  --c1:#2448C8;--c2:#0E7C66;--c3:#9A5B00;--c4:#8A2F8A;--bad:#B0342A;--note:#E8EEFF;--noteline:#9DB1F2;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151D;--card:#19212C;--ink:#E8ECF2;--sub:#A6B1C1;--line:#2E3949;--me:#4A67D8;
  --c1:#7D98FF;--c2:#3FC2A2;--c3:#E0A64A;--c4:#D68AD6;--bad:#E8766B;--note:#1C2640;--noteline:#3A4F8F}}
:root[data-theme="dark"]{--bg:#10151D;--card:#19212C;--ink:#E8ECF2;--sub:#A6B1C1;--line:#2E3949;--me:#4A67D8;
  --c1:#7D98FF;--c2:#3FC2A2;--c3:#E0A64A;--c4:#D68AD6;--bad:#E8766B;--note:#1C2640;--noteline:#3A4F8F}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:17px;line-height:1.6;word-break:keep-all;display:flex;flex-direction:column}
header.top{flex:none;background:var(--card);border-bottom:1px solid var(--line)}
header.top .in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px}
header.top h1{font-size:18px;margin:0;font-weight:800;flex:1}
header.top h1 small{font-weight:400;color:var(--sub);font-size:13px;margin-left:6px}
#log{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#log .in{max-width:720px;margin:0 auto;padding:14px 16px 8px}
.msg{display:flex;margin:10px 0}
.msg.me{justify-content:flex-end}
.bub{max-width:88%;padding:11px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.msg.me .bub{background:var(--me);color:var(--meink);border-color:var(--me);border-bottom-right-radius:4px;max-width:80%}
.msg.bot .bub{border-bottom-left-radius:4px}
.bub p{margin:0 0 8px}.bub p:last-child{margin-bottom:0}
.bub b.h{display:block;font-size:18px;margin-bottom:4px}
.bub .pal{background:var(--note);border:1px solid var(--noteline);border-radius:10px;padding:8px 12px;margin:8px 0}
.bub .pal b{color:var(--c1)}
.bub table{width:100%;border-collapse:collapse;font-size:15px;margin:6px 0}
.bub th,.bub td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.bub ul{margin:4px 0;padding-left:20px}
.bub.wide{max-width:100%;width:100%}
#ctl{flex:none;background:var(--card);border-top:1px solid var(--line)}
#ctl .in{max-width:720px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.choices{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;border-radius:10px}
.ch{border:1.5px solid var(--c1);background:var(--card);color:var(--c1);padding:8px 14px;font-weight:700;font-size:16px}
.ch.sub{border-color:var(--line);color:var(--sub);font-weight:400}
.ch.tg[aria-pressed=true]{background:var(--c1);color:#fff}
.ch.go{background:var(--c1);color:#fff}
.inrow{display:flex;gap:8px;margin-top:8px}
.inrow input{flex:1;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.tools{display:flex;justify-content:space-between;margin-top:8px}
.tools button{border:none;background:transparent;color:var(--sub);font-size:14px;padding:4px 2px}
:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
.map{width:100%;height:auto;display:block;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin:6px 0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--sub)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.empty{color:var(--bad);font-weight:700}
.log{border-left:3px solid var(--c3);padding:2px 0 2px 10px;margin:8px 0;font-size:15px}
.log.f{border-color:var(--c4)}
.small{font-size:13px;color:var(--sub)}
.k1{color:var(--c1)}.k2{color:var(--c2)}.k3{color:var(--c3)}.k4{color:var(--c4)}.kb{color:var(--bad)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acts button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 10px;font-size:14px;font-weight:700}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:var(--card);
  padding:10px 16px;border-radius:8px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 eff:{h:'효과는 무엇인가요?',b:[

 twin:{h:'디지털 트윈이란?',b:[

  PAL('<b>팔란티어가 온톨로지를 조직의 디지털 쌍둥이로 보는 까닭</b><br>액션(무엇을 누가 왜 바꿨나)이 기록될 때마다 지도도 함께 바뀌기 때문입니다. 지도가 현실을 따라가야 그 위의 판단 규칙과 AI도 오늘의 현실을 봅니다.')+
  '<p>이 앱은 센서나 실시간 연결 없이 <b>사람이 채워 가는 쌍둥이</b>입니다(외부 전송 없음). 그래서</p>'+

  '<p>— 이것이 곧 트윈을 키우는 일입니다. 저장한 지도를 「지난 기록」에서 열면 <b>이어서 키우기</b> 단추가 나옵니다.</p>']},
 self:{h:'나를 알아가는 법',b:[
  '<p>나를 「성격」으로 보지 않고, <b>나를 흔드는 문제</b>와 <b>그것을 지금 막아 주고 있는 것</b>(습관·사람·규칙·쉬는 시간)으로 보는 관점입니다.</p>'+
  '<table><tr><th>나를 볼 때</th><th>온톨로지에서는</th><th>예</th></tr><tr><td>나를 흔드는 문제</td><td>오브젝트</td><td>야간 뒤 잠 부족</td></tr><tr><td>그것을 막는 수단</td><td>링크</td><td>운동 → 막고 있다 → 잠 부족</td></tr><tr><td>얼마나 풀렸나</td><td>속성</td><td>이번 주 사흘은 괜찮았다</td></tr><tr><td>바꿔 본 것</td><td>액션</td><td>퇴근 뒤 휴대폰 30분 끄기</td></tr></table>'+
  PAL('<b>이건 사고방식을 빌리는 것이지 심리 검사가 아닙니다.</b> 점수나 진단을 내지 않습니다. 마음이 많이 힘들 때는 지도를 그리기보다 상담이 먼저입니다(T-Book 현장심리 › 회복·스트레스).')+
  '<p class="small">「바로 내 문제에 써 보기 → 나」에서 시작합니다. 적은 내용은 이 기기에만 남습니다.</p>']}

function blankB(){return{id:'o'+Date.now(),dom:null,title:'',q:{decision:'',now:''},types:[],links:[],actions:[],funcs:[],changed:null,changeWhy:'',saved:null,log:[],snaps:[]};}
/* v4 — 옛 기록(log·snaps 없는 것)도 열리게 빈 칸을 채운다 */
function norm(B){B=B||blankB();['types','links','actions','funcs','log','snaps'].forEach(function(k){if(!Array.isArray(B[k]))B[k]=[];});if(!B.q)B.q={decision:'',now:''};return B;}
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){toast('저장 공간이 부족합니다');}}
var ST=load('onto3_state',null)||{msgs:[],node:'start',B:blankB(),tmp:{},sel:[],undo:[]};
ST.B=norm(ST.B);if(!ST.tmp)ST.tmp={};if(!ST.undo)ST.undo=[];
var HIST=load('onto3_history',[]);
function addLog(w){ST.B.log.push({d:today(),w:w});if(ST.B.log.length>300)ST.B.log=ST.B.log.slice(-300);}
/* v4 — 개인을 알아볼 수 있는 형태(차량번호·휴대전화·주민등록번호). 형식만 잡으니 날짜·장소가 구체적이면 그것도 사람을 드러낸다 */
var PII=[/\d{2,3}\s?[가-힣]\s?\d{4}/g,/01[016789][-.\s]?\d{3,4}[-.\s]?\d{4}/g,/\d{6}[-\s]?[1-8]\d{6}/g];
function hasPII(v){return PII.some(function(r){r.lastIndex=0;return r.test(v);});}
function scrubPII(v){PII.forEach(function(r){r.lastIndex=0;v=v.replace(r,'○○');});return v;}
/* 넣기 전에 묻는다 — 확인: ○○로 바꿔 넣음 · 취소: 넣지 않고 칸으로 돌아감(null) */
function piiGate(v){if(!v||!hasPII(v))return v;
  return confirm('개인을 알아볼 수 있는 정보(차량번호·전화번호·주민번호 형태)가 있습니다. 지우고 넣을까요?\n\n[확인] 그 부분을 ○○로 바꿔 넣기\n[취소] 넣지 않고 고치러 돌아가기')?scrubPII(v):null;}
function persist(){var c={msgs:ST.msgs.slice(-160),node:ST.node,B:ST.B,tmp:ST.tmp,sel:[],lastB:ST.lastB||null,undo:ST.undo.slice(-15)};save('onto3_state',c);}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(p){return (p||'x')+Math.random().toString(36).slice(2,8);}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},1900);}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function copyText(txt){function fb(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);toast(ok?'복사했습니다':'복사 실패 — 길게 눌러 직접 복사하세요');}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(function(){toast('복사했습니다');},fb);else fb();}
function D(){return DOM[ST.B.dom]||DOM.traffic;}
function allObjs(){var a=[];ST.B.types.forEach(function(t,ti){t.objs.forEach(function(o){a.push({o:o,t:t,ti:ti});});});return a;}
function objById(id){var r=null;allObjs().forEach(function(x){if(x.o.id===id)r=x;});return r;}

function svgMap(){var nodes=allObjs();if(!nodes.length)return '';
  var W=640,H=Math.max(340,110+nodes.length*24),cx=W/2,cy=H/2,R=Math.min(W,H)/2-70,pos={};
  nodes.forEach(function(n,i){var a=-Math.PI/2+i*2*Math.PI/nodes.length;pos[n.o.id]={x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),n:n};});
  var s='<svg class="map" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="온톨로지 지도"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--sub)"/></marker></defs>';
  ST.B.links.forEach(function(l){var a=pos[l.from],b=pos[l.to];if(!a||!b||a===b)return;var dx=b.x-a.x,dy=b.y-a.y,dd=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/dd,uy=dy/dd,r=22;
    s+='<line x1="'+(a.x+ux*r)+'" y1="'+(a.y+uy*r)+'" x2="'+(b.x-ux*r)+'" y2="'+(b.y-uy*r)+'" stroke="var(--sub)" stroke-width="1.5" marker-end="url(#ar)"/>';
    if(l.rel)s+='<text x="'+((a.x+b.x)/2)+'" y="'+((a.y+b.y)/2-4)+'" font-size="13" text-anchor="middle" fill="var(--sub)" paint-order="stroke" stroke="var(--bg)" stroke-width="4">'+esc(l.rel)+'</text>';});
  Object.keys(pos).forEach(function(id){var p=pos[id],c='var('+COLORS[p.n.ti%4]+')',act=ST.B.actions.some(function(a){return a.target===id;});
    s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="20" fill="var(--card)" stroke="'+c+'" stroke-width="'+(act?6:3)+'"/><text x="'+p.x+'" y="'+(p.y+40)+'" font-size="14" font-weight="700" text-anchor="middle" fill="var(--ink)" paint-order="stroke" stroke="var(--bg)" stroke-width="4">'+esc(p.n.o.name)+'</text>';});
  return s+'</svg><div class="legend">'+ST.B.types.map(function(t,ti){return '<span><i style="background:var('+COLORS[ti%4]+')"></i>'+esc(t.name)+'</span>';}).join('')+'<span>굵은 테두리 = 액션이 걸린 대상</span></div>';}
/* v4 — 빈 곳을 종류(k)와 자리까지 돌려준다(이어서 키우기가 그 칸으로 바로 간다). gaps() 는 글만 */
function gapsX(){var B=ST.B,g=[];
  B.types.forEach(function(t,ti){t.props.forEach(function(p,pi){if(p.src==='아직 모름')g.push({k:'src',ti:ti,pi:pi,s:t.name+'의 「'+p.name+'」 — 어디서 알지 아직 모름'});});if(!t.objs.length)g.push({k:'noobj',ti:ti,s:t.name+' — 실제 대상 없음'});});
  var ln={};B.links.forEach(function(l){ln[l.from]=1;ln[l.to]=1;});if(allObjs().length>1)allObjs().forEach(function(x){if(!ln[x.o.id])g.push({k:'nolink',id:x.o.id,s:x.o.name+' — 다른 것과의 선이 없음'});});
  B.actions.forEach(function(a,ai){if(!a.plan&&!a.result)g.push({k:'nores',ai:ai,s:'액션 「'+a.name+'」 — 결과 확인 없음'});if(!a.who)g.push({k:'nowho',ai:ai,s:'액션 「'+a.name+'」 — 권한자 미정'});});
  B.funcs.forEach(function(f,fi){if(!f.need)g.push({k:'noneed',fi:fi,s:'규칙 「'+f.when+'」 — 조건을 알아챌 자료 미정'});});return g;}
function gaps(){return gapsX().map(function(x){return x.s;});}
function resultHTML(){var B=ST.B,g=gaps(),h;
  h='<b class="h">'+esc(B.title||'이름 없는 지도')+'</b><p class="small">'+(B.dom?DOM[B.dom].label+' · ':'')+'지금 판단: '+esc(B.q.now||'—')+'</p>'+svgMap();
  B.types.forEach(function(t,ti){if(!t.objs.length&&!t.props.length)return;
    h+='<p style="margin-top:10px"><b class="k'+((ti%4)+1)+'">'+esc(t.name)+'</b>: '+esc(t.objs.map(function(o){return o.name;}).join(', ')||'—')+'<br><span class="small">볼 것 — '+(t.props.map(function(p){return esc(p.name)+(p.src==='아직 모름'?' <span class="kb">(출처 모름)</span>':' ('+esc(p.src)+')');}).join(', ')||'없음')+'</span></p>';});
  if(B.actions.length){h+='<p style="margin-top:10px"><b class="k3">액션 기록</b></p>';B.actions.forEach(function(a){var t=objById(a.target);
    h+='<div class="log"><span class="small">'+(a.plan?'계획':esc(a.date||'날짜 없음'))+' · 권한 '+esc(a.who||'미정')+'</span><br><b>'+esc(a.name)+'</b>'+(t?' → '+esc(t.o.name):'')+'<br>왜: '+esc(a.why||'—')+(a.plan?'':'<br>결과: '+(a.result?esc(a.result):'<span class="empty">확인 안 됨</span>'))+'</div>';});}
  if(B.funcs.length){h+='<p style="margin-top:10px"><b class="k4">판단 규칙</b></p>';B.funcs.forEach(function(f){h+='<div class="log f">'+esc(f.when)+' → <b>'+esc(f.then||'?')+'</b><br><span class="small">알아채는 자료: '+esc(f.need||'미정')+(f.src?' · 출처: '+esc(f.src):'')+'</span></div>';});}
  h+='<p style="margin-top:10px"><b class="kb">빈 곳 = 다음에 할 일 ('+g.length+')</b></p>'+(g.length?'<ul>'+g.slice(0,20).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'<p>빈 곳이 없습니다.</p>');
  if(B.snaps.length>1)h+='<p class="small">저장할 때마다 빈 곳: <b>'+B.snaps.slice(-8).map(function(x){return x.g;}).join(' → ')+'</b> ('+esc(B.snaps[0].d)+'부터 '+B.snaps.length+'번 저장)</p>';
  if(B.log.length)h+='<p style="margin-top:10px"><b class="k2">자라 온 기록 ('+B.log.length+')</b></p><ul>'+B.log.slice(-12).reverse().map(function(x){return '<li><span class="small">'+esc(x.d)+'</span> '+esc(x.w)+'</li>';}).join('')+'</ul>'+(B.log.length>12?'<p class="small">앞의 '+(B.log.length-12)+'건은 「글로 복사」에 다 들어 있습니다.</p>':'');
  if(B.changed)h+='<p class="small">결정 변화: '+esc(B.changed)+(B.changeWhy?' — '+esc(B.changeWhy):'')+'</p>';
  h+='<div class="acts"><button type="button" data-act="txt">글로 복사</button><button type="button" data-act="csv">표(CSV) 복사</button><button type="button" data-act="json">백업 복사</button><button type="button" data-act="save">기록에 저장</button></div>';
  return h;}
function asText(){var B=ST.B,L=['[온톨로지] '+B.title+' ('+today()+')','영역: '+(B.dom?DOM[B.dom].label:'')+' / 지금 판단: '+B.q.now,''];
  B.types.forEach(function(t){L.push('■ '+t.name+': '+t.objs.map(function(o){return o.name;}).join(', '));L.push('   볼 것: '+t.props.map(function(p){return p.name+'('+p.src+')';}).join(', '));});
  L.push('','■ 링크');B.links.forEach(function(l){var a=objById(l.from),b=objById(l.to);if(a&&b)L.push('  '+a.o.name+' → '+l.rel+' → '+b.o.name);});
  L.push('','■ 액션');B.actions.forEach(function(a){var t=objById(a.target);L.push('  ['+(a.plan?'계획':(a.date||''))+'] '+a.name+(t?' → '+t.o.name:'')+' / 권한 '+(a.who||'미정'));L.push('    왜: '+(a.why||'—')+(a.plan?'':' / 결과: '+(a.result||'확인 안 됨')));});
  L.push('','■ 판단 규칙');B.funcs.forEach(function(f){L.push('  '+f.when+' → '+f.then+' (자료: '+(f.need||'미정')+')'+(f.src?' [출처: '+f.src+']':''));});
  var g=gaps();L.push('','■ 빈 곳 ('+g.length+')');g.forEach(function(x){L.push('  - '+x);});
  if(B.snaps.length>1)L.push('  저장할 때마다 빈 곳: '+B.snaps.map(function(x){return x.g;}).join(' → '));
  if(B.log.length){L.push('','■ 자라 온 기록 ('+B.log.length+')');B.log.forEach(function(x){L.push('  '+x.d+' '+x.w);});}
  if(B.changed)L.push('','결정 변화: '+B.changed+(B.changeWhy?' — '+B.changeWhy:''));return L.join('\n');}
function cq(s){s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function asCSV(){var O=[['id','타입','이름']],K=[['출발','관계','도착']],A=[['날짜','액션','대상','권한','왜','결과']];
  allObjs().forEach(function(x){O.push([x.o.id,x.t.name,x.o.name]);});ST.B.links.forEach(function(l){K.push([l.from,l.rel,l.to]);});
  ST.B.actions.forEach(function(a){A.push([a.plan?'계획':a.date,a.name,a.target,a.who,a.why,a.result]);});
  function j(r){return r.map(function(x){return x.map(cq).join(',');}).join('\n');}
  return '# objects.csv\n'+j(O)+'\n\n# links.csv\n'+j(K)+'\n\n# actions.csv\n'+j(A);}
function saveHist(){var B=ST.B;B.saved=today()+' '+new Date().toTimeString().slice(0,5);
  var sp={d:today(),g:gapsX().length,o:allObjs().length,l:B.links.length,a:B.actions.length},ls=B.snaps[B.snaps.length-1];
  if(!B.log.length)addLog('처음 지도 — 대상 '+sp.o+' · 선 '+sp.l+' · 액션 '+sp.a);
  if(ls&&ls.g===sp.g&&ls.o===sp.o&&ls.l===sp.l&&ls.a===sp.a)ls.d=sp.d;else{B.snaps.push(sp);if(B.snaps.length>30)B.snaps=B.snaps.slice(-30);}
  var k=JSON.parse(JSON.stringify(B));
  HIST=HIST.filter(function(x){return x.id!==k.id;});HIST.push(k);if(HIST.length>60)HIST=HIST.slice(-60);save('onto3_history',HIST);toast('기록에 저장했습니다');}
function example(){var B=blankB();B.dom='traffic';B.title='평일 15:30 성모병원사거리 정체를 어디서 먼저 끊을까';B.q={decision:B.title,now:'경험과 감'};
  function T(n,p){var t={id:uid('t'),name:n,props:p.map(function(x){return{name:x[0],src:x[1]};}),objs:[]};B.types.push(t);return t;}
  function O(t,n){var o={id:uid('b'),name:n,vals:{}};t.objs.push(o);return o.id;}
  var X=T('교차로',[['정체 시간대','현장관찰'],['신호 운영','내부자료'],['통행속도','아직 모름']]),C=T('원인시설',[['몰리는 시각','현장관찰'],['수업 시각','아직 모름']]),R=T('도로·분기점',[['소화량','내부자료'],['우회 가능','현장관찰']]);
  var sm=O(X,'성모병원사거리'),hg=O(C,'삼호가든·궁전 학원가'),sp=O(R,'사평대로'),sj=O(R,'사평지하차도');
  B.links=[{id:uid('l'),from:hg,rel:'차량을 보낸다',to:sm},{id:uid('l'),from:sm,rel:'대기를 넘긴다',to:sp},{id:uid('l'),from:sj,rel:'우회로가 된다',to:sm}];
  B.actions=[{id:uid('a'),name:'직좌 동시신호 후 5초 뒤 좌회전만, 19시까지',plan:false,target:sm,who:'시설담당(배분값)',date:'',why:'학원차·학부모 차량이 사평지하차도 대신 상부로 몰려 꼬리물기. 사평대로 소화량 기준',result:'체감 개선 — 통행속도 전후 비교는 아직'}];
  B.funcs=[{when:'하류(사평대로)가 받아줄 수 없을 때',then:'정체 출발점이 아니라 상류에서 먼저 끊는다',need:'사평대로 대기 길이, 시간대별 통행속도'}];return B;}

/* ---------- 그리기·진행 ---------- */
var msgs=document.getElementById('msgs'),ctl=document.getElementById('ctlin'),logEl=document.getElementById('log');
function push(who,html){ST.msgs.push({w:who,h:html});}
function drawMsgs(){msgs.innerHTML=ST.msgs.map(function(m){return '<div class="msg '+m.w+'"><div class="bub'+(m.h.indexOf('class="map"')>-1||m.h.indexOf('<table')>-1?' wide':'')+'">'+m.h+'</div></div>';}).join('');
  requestAnimationFrame(function(){logEl.scrollTop=logEl.scrollHeight;});}
var CUR=null;
function enter(id){
  if(typeof id==='function')id=id();
  if(id==='hist'||id==='start'){ST.tmp={};}
  if((id.indexOf('b.')===0&&id!=='b.end'&&id!=='b.end2')||id.indexOf('g.')===0)ST.lastB=id;else if(id.indexOf('grow')===0)ST.lastB='grow.r';else if(id==='start'||id==='b.end'||id==='b.end2'||id==='ex')ST.lastB=null;
  ST.node=id;var n=N(id);CUR=n;ST.sel=[];
  (n.say||[]).forEach(function(s){push('bot',s);});
  if(n.auto){persist();return enter(n.auto);}
  persist();drawMsgs();drawCtl();
}
function drawCtl(){var u=CUR.ui||{},h='';
  if(u.multi){h+='<div class="choices">'+u.multi.map(function(x,i){return '<button type="button" class="ch tg" data-tg="'+i+'" aria-pressed="false">'+esc(x)+'</button>';}).join('')+'</div>';}
  if(u.choices&&u.choices.length){h+='<div class="choices"'+(u.multi?' style="margin-top:8px"':'')+'>'+u.choices.map(function(c,i){return '<button type="button" class="ch'+(c.sub?' sub':'')+'" data-c="'+i+'">'+esc(c.l)+'</button>';}).join('')+'</div>';}
  if(u.input){h+='<div class="inrow"><input type="text" id="inp" placeholder="'+esc(u.input.ph)+'" enterkeyhint="send" aria-label="'+esc(u.input.ph)+'">'+(u.next?'':'<button type="button" class="ch go" id="send">보내기</button>')+'</div>';}
  if(u.next)h+='<div class="choices" style="margin-top:8px"><button type="button" class="ch go" id="nx">다음</button></div>';
  h+='<div class="tools"><span>'+(u.why?'<button type="button" id="why">왜 이걸 묻나요?</button>':'')+'</span><button type="button" id="undo"'+(ST.undo.length?'':' hidden')+'>되돌리기</button></div>';
  ctl.innerHTML=h;}
function snap(){ST.undo.push(JSON.stringify({msgs:ST.msgs,node:ST.node,B:ST.B,tmp:ST.tmp,lastB:ST.lastB||null}));if(ST.undo.length>15)ST.undo.shift();}
function answer(label,fn,go){snap();push('me',esc(label));if(fn)fn();enter(go);}
ctl.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var u=CUR.ui||{};
  if(b.dataset.c!=null){var c=u.choices[+b.dataset.c];answer(c.l,c.fn,c.go);return;}
  if(b.dataset.tg!=null){var on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);var v=u.multi[+b.dataset.tg];
    if(on)ST.sel.push(v);else ST.sel=ST.sel.filter(function(x){return x!==v;});return;}
  if(b.id==='send'){submitInput();return;}
  if(b.id==='nx'){var ex=(document.getElementById('inp')||{}).value||'';if(ex){ex=piiGate(ex);if(ex===null)return;}snap();var lbl=ST.sel.concat(ex.split(',').map(function(s){return s.trim();}).filter(Boolean)).join(', ')||'(없음)';
    var go=u.next(ST.sel.slice(),ex);if(go===false){ST.undo.pop();return;}push('me',esc(lbl));enter(go);return;}
  if(b.id==='why'){push('bot','<div class="pal">'+esc(WHY[u.why])+'</div>');persist();drawMsgs();return;}
  if(b.id==='undo'){var s=ST.undo.pop();if(!s)return;var o=JSON.parse(s);
    ST.msgs=o.msgs;ST.B=o.B;ST.tmp=o.tmp;ST.node=o.node;ST.lastB=o.lastB;CUR=N(o.node);ST.sel=[];persist();drawMsgs();drawCtl();return;}
});
function submitInput(){var u=CUR.ui||{},el=document.getElementById('inp');if(!el)return;var v=el.value.trim();if(!v){toast('내용을 적어 주세요');return;}
  v=piiGate(v);if(v===null){el.focus();return;}
  answer(v,function(){u.input.fn(v);},u.input.go);}
ctl.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='inp'&&!e.isComposing){e.preventDefault();if(CUR.ui&&CUR.ui.next)document.getElementById('nx').click();else submitInput();}});
msgs.addEventListener('click',function(e){var b=e.target.closest('button[data-act]');if(!b)return;var a=b.dataset.act;
  if(a==='txt')copyText(asText());else if(a==='csv')copyText(asCSV());else if(a==='json')copyText(JSON.stringify(ST.B));else if(a==='save')saveHist();});
document.getElementById('home').addEventListener('click',function(){if((ST.node.indexOf('b.')===0||ST.node.indexOf('g.')===0||ST.node.indexOf('grow')===0)&&ST.node!=='b.end'&&ST.node!=='b.end2'&&!confirm('처음으로 갈까요? 작성 중인 내용은 "되돌리기"로만 돌아올 수 있습니다.'))return;
  snap();ST.msgs=[];enter('start');});
document.getElementById('thm').addEventListener('click',function(){var r=document.documentElement,c=r.getAttribute('data-theme'),dk=c?c==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.setAttribute('data-theme',dk?'light':'dark');save('onto3_theme',r.getAttribute('data-theme'));});

var th=load('onto3_theme',null);if(th)document.documentElement.setAttribute('data-theme',th);
/* v4 — T-Book 에서 바로 들어오는 문: #field(지난 현장 복기) · #learn(배우기). 하던 대화는 「되돌리기」에 남기고 새로 연다 */
var hsh=(location.hash||'').slice(1);
if(hsh==='field'||hsh==='learn'){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(ST.msgs.length)snap();ST.msgs=[];
  if(hsh==='field'){ST.B=blankB();ST.B.dom='field';ST.tmp={};push('bot','<p>T-Book 현장심리에서 왔습니다. 지난 현장 하나를 <b>상황 단위로</b> 복기합니다 — 어디서 꼬였고, 무엇이 통했고, 다음엔 무엇을 할지.</p>');enter('b.q');}
  else enter('L:what');}
else if(ST.msgs.length){CUR=N(ST.node);drawMsgs();drawCtl();}else enter('start');
})();
</script>
</body>
</html>
